name: Automated Drip Campaign

on:
  schedule:
    # Cada hora en punto, de 08:00 a 18:00 UTC, de lunes a viernes. Sin fines de semana.
    # GitHub Actions NO dispara crones sub-horarios de forma fiable (los limita a ~1/hora),
    # así que la cadencia honesta es horaria: 15 correos por impulso x 11h = ~165/día laborable.
    - cron: '0 8-18 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  run-drip-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar script cron de OVH
        run: |
          curl -sS "https://standarte.es/admin/email_campaing/cron_drip.php?token=TKN-8f3a9b1c7d2e4"
