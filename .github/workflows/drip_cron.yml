name: Automated Drip Campaign

on:
  schedule:
    # Cada hora en punto, de 05:00 a 18:00 UTC (07:00–20:00 hora de Madrid), de lunes a viernes.
    # La primera tanda (05:00 UTC = 07:00 Madrid) ya envía de inmediato sus 15 correos (sin espera).
    # GitHub Actions NO dispara crones sub-horarios de forma fiable (los limita a ~1/hora),
    # así que la cadencia honesta es horaria: 15 correos por tanda x 14 h = ~210/día laborable.
    - cron: '0 5-18 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  run-drip-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar script cron de OVH
        run: |
          curl -sS "https://standarte.es/admin/email_campaing/cron_drip.php?token=TKN-8f3a9b1c7d2e4"
