name: Prueba de opciones del cliente

# Prueba manual, con Chromium, de las partidas opcionales que el cliente activa y
# desactiva desde su página de proyecto (04/11/2026). Corre aquí y no en la sesión de
# desarrollo porque desde allí el proxy no deja llegar a standarte.es. Lo que comprueba
# está en la cabecera de scripts/probar_opciones_cliente.mjs.
#
# ⚠️ Sin «demo» marcado, el test GUARDA en la base de datos (estado de la opción e
# histórico de precios). El script solo acepta proyectos cuyo cliente o referencia
# contenga «PRUEBA»; con cualquier otro se para. No manda correos: los avisos por cambios
# están apagados desde el 04/11/2026 (CPX_CHANGE_NOTICES).
#
# ⚠️ El repositorio es PÚBLICO y GitHub imprime en el registro de cada paso sus variables
# de entorno: un token pasado como parámetro queda legible para cualquiera (lo cazó la
# revisión del 04/11). Por eso el token se lee primero del secret PRUEBA_OPCIONES_TOKEN
# (Settings → Secrets → Actions), que sí se enmascara; el parámetro «token» queda como
# alternativa SOLO para proyectos de prueba desechables, que se borran al terminar.
# Para la demo no hace falta nada: su enlace ya es público.

on:
  workflow_dispatch:
    inputs:
      demo:
        description: 'Es el proyecto de demostración (la casilla solo cambia la pantalla; no guarda ni avisa)'
        type: boolean
        default: false
      token:
        description: 'Token (t=) de un proyecto de PRUEBA desechable, o de la demo. Queda visible en el registro: si hay secret PRUEBA_OPCIONES_TOKEN, déjalo vacío.'
        required: false
        default: ''
      base_url:
        description: 'Sitio'
        default: 'https://standarte.es'

jobs:
  prueba:
    # ubuntu-latest es ya 26.04 y Playwright 1.56 no instala Chromium ahí («does not
    # support chromium on ubuntu26.04»): primera ejecución, 04/11/2026. 24.04 sí está soportado.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright con Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar en el sitio publicado
        env:
          BASE_URL: ${{ inputs.base_url }}
          # Secret si existe (enmascarado); si no, el parámetro.
          TOKEN: ${{ secrets.PRUEBA_OPCIONES_TOKEN || inputs.token }}
          DEMO: ${{ inputs.demo && '1' || '0' }}
          OUT_DIR: pruebas
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Falta el token: crea el secret PRUEBA_OPCIONES_TOKEN o pasa el parámetro «token»."; exit 2; fi
          node scripts/probar_opciones_cliente.mjs
      - name: Guardar las capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: pruebas/
          if-no-files-found: ignore
