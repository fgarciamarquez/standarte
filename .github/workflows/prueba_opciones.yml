name: Prueba de opciones del cliente

# Prueba manual, con Chromium, de las partidas opcionales que el cliente activa y
# desactiva desde su página de proyecto (04/11/2026). Corre aquí y no en la sesión de
# desarrollo porque desde allí el proxy no deja llegar a standarte.es. Lo que comprueba
# está en la cabecera de scripts/probar_opciones_cliente.mjs.
#
# ⚠️ Sin «demo» marcado, el test GUARDA en la base de datos y MANDA DOS CORREOS al
# interlocutor del proyecto (opción activada / desactivada). Solo con un proyecto de
# prueba; nunca con el de un cliente.

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Token del proyecto (parámetro t= de su enlace). Solo un proyecto de PRUEBA.'
        required: true
      demo:
        description: 'Es el proyecto de demostración (la casilla solo cambia la pantalla; no guarda ni avisa)'
        type: boolean
        default: false
      base_url:
        description: 'Sitio'
        default: 'https://standarte.es'

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright con Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar en el sitio publicado
        env:
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ inputs.token }}
          DEMO: ${{ inputs.demo && '1' || '0' }}
          OUT_DIR: pruebas
        run: node scripts/probar_opciones_cliente.mjs
      - name: Guardar las capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: pruebas/
          if-no-files-found: ignore
