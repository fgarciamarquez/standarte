name: Publicación Autónoma de Noticias

on:
  schedule:
    # Lunes, miércoles y viernes a las 08:00 UTC (10:00 hora española).
    # 3 noticias/semana: misma señal de frescura SEO con la mitad de carga de deploy.
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:
    # Habilita un botón en la interfaz de GitHub para ejecutarlo manualmente

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4
        with:
          # Permite descargar con permisos de escritura para empujar los cambios de vuelta
          token: ${{ secrets.GITHUB_TOKEN }}
          # Historial completo: necesario para rebase fiable si main avanza durante el run.
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Generar Noticia Autónoma (IA o Fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/autonomous_generator.cjs

      - name: Compilar Sitio Estático (SvelteKit)
        run: npm run build

      - name: Desplegar por FTP a OVH (Limpieza y Sincronización)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: node deploy_clean.cjs --fast

      - name: Guardar Base de Datos de Noticias en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/newsData.json
          git commit -m "chore(news): auto-update daily news article [skip ci]" || { echo "Sin cambios que commitear"; exit 0; }
          # main puede avanzar durante el run (el deploy FTP dura ~20 min). Reintenta con
          # rebase para no perder el commit por una carrera de pushes concurrentes.
          for intento in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push; then
              echo "Push OK (intento $intento)"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push rechazado o rebase fallido; main avanzó. Reintento $intento tras pausa..."
            sleep 7
          done
          echo "::error::No se pudo hacer push de newsData.json tras 5 reintentos"
          exit 1
