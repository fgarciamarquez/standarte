name: Weekly Project Reminder

on:
  schedule:
    # Miércoles a las 07:03 y 08:03 UTC: una de las dos son las 09:xx de Madrid según el
    # horario (verano/invierno). El PHP descarta la llamada fuera de ventana y la columna
    # reminder_sent_at desduplica, así que nunca sale un recordatorio doble.
    - cron: '3 7,8 * * 3'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  project-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar cron de recordatorios de proyecto en OVH
        run: |
          curl -sS "https://standarte.es/admin/cron_recordatorio.php?token=TKN-recordatorio-9b1d6e3f2a"
