name: Weekly Project Reminder

on:
  schedule:
    # Miércoles a las 07:03 y 08:03 UTC: una de las dos son las 09:xx de Madrid según el
    # horario (verano/invierno). El PHP descarta la llamada fuera de ventana y la columna
    # reminder_sent_at desduplica, así que nunca sale un recordatorio doble.
    - cron: '3 7,8 * * 3'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Modo prueba: envía UN recordatorio solo a javier@standarte.es, sin anotar nada'
        type: boolean
        default: false
      ref:
        description: 'Referencia del proyecto para la prueba (vacío = primer proyecto elegible)'
        type: string
        default: ''

jobs:
  project-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar cron de recordatorios de proyecto en OVH
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.prueba }}" = "true" ]; then EXTRA="&test=1&ref=$(printf %s "${{ github.event.inputs.ref }}" | jq -sRr @uri)"; fi
          curl -sS "https://standarte.es/admin/cron_recordatorio.php?token=TKN-recordatorio-9b1d6e3f2a${EXTRA}"
