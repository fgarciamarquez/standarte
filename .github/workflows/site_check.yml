# Diagnóstico manual: pide al servidor real una lista de URL y muestra código, redirección y
# tipo de contenido (con User-Agent de navegador: el .htaccess bloquea el de curl).
name: Site Check
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Rutas separadas por espacios'
        required: false
        default: '/galeria /galeria/__data.json /precios /precios/__data.json /en/gallery /en/gallery/__data.json'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar URL
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          for p in ${{ github.event.inputs.paths }}; do
            echo "=== $p"
            curl -sS -o /tmp/body -A "$UA" -w 'code=%{http_code} redirect=%{redirect_url} type=%{content_type} size=%{size_download}\n' "https://standarte.es$p"
            head -c 200 /tmp/body | tr '\n' ' '; echo
            echo "enlaces de galeria:"; grep -oE 'href="[^"]*(galer|gallery|proyectos_a_medida|custom_projects)[^"]*"' /tmp/body | sort | uniq -c || true
            echo "cache: $(curl -sSI -A "$UA" "https://standarte.es$p" | grep -iE '^(cache-control|expires|last-modified|age|x-cache)' | tr '\r\n' '  ')"
            echo "title: $(grep -oE '<title>[^<]*' /tmp/body | head -1 | sed 's/<title>//')"
            echo "robots: $(grep -oE '<meta name="robots" content="[^"]*"' /tmp/body | head -1)"
            echo "canonical: $(grep -oE '<link rel="canonical" href="[^"]*"' /tmp/body | head -1)"
            echo "cabeceras: $(curl -sSI -A "$UA" "https://standarte.es$p" | grep -iE '^(x-robots-tag|location|content-type|link)' | tr '\r\n' '  ')"
            GB='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
            echo "como Googlebot: $(curl -sS -o /dev/null -A "$GB" -w 'code=%{http_code} redirect=%{redirect_url} size=%{size_download}' "https://standarte.es$p")"
          done
