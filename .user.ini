; Ajustes de PHP para TODO el sitio. PHP lee los .user.ini desde la carpeta del script
; hacia arriba hasta el document root, así que lo de aquí alcanza también a /admin, que
; tiene el suyo propio para los límites de subida (no repite estas claves).
;
; ── Mitigación parcial de CVE-2026-109618 (30/10/2026) ──────────────────────────────
; El 21/10/2026 PHP publicó 8.3.36 (y 8.2.35 / 8.4.27 / 8.5.12) para dos fallos CRÍTICOS
; del NÚCLEO, CVE-2026-109618 y CVE-2026-109619: ejecución remota de código SIN
; autenticación, con explotación activa. Se disparan cuando PHP procesa la petición,
; ANTES de ejecutar una sola línea de nuestro código, así que la contraseña del panel no
; protege de ellos y da igual lo limpio que esté el PHP de la casa.
;
; El arreglo de verdad es que OVH sirva 8.3.36 o superior: .ovhconfig fija la RAMA (8.3),
; no la versión, y el binario es suyo. Esto es solo una mitigación parcial mientras tanto.
;
; Por qué esta línea y no otra: una de las dos vulnerabilidades está ligada al
; deserializador de «upload progress» de las sesiones, que PHP trae ACTIVADO por defecto.
; Nuestro código no lo usa en ningún sitio (las subidas van por fetch y el progreso, si se
; muestra, es del lado del navegador), así que apagarlo no rompe nada.
;
; Lo que NO cubre, y conviene no olvidarlo:
;   · No hace nada contra CVE-2026-109619 (estado obsoleto / OPcache).
;   · No sustituye a la actualización. Si OVH ya sirve 8.3.36, esta línea sobra pero no
;     molesta; si no la sirve, esto reduce la exposición, no la elimina.
; Comprobar la versión servida: pie del panel en /admin/email_campaing/index.php.
;
; Dos ajustes que se sugieren por ahí y que aquí NO se ponen a propósito:
;   · memory_limit = -1 — en hosting compartido es pedir problemas, y /admin está en 256M
;     a propósito para las subidas de 100 MB.
;   · fatal_error_backtraces — NO EXISTE en PHP 8.3 (comprobado: es de la 8.5). Ponerlo
;     sería una línea muerta que da falsa sensación de estar protegido.
session.upload_progress.enabled = 0
