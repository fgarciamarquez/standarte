<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        personalization_storage: 'denied',
        security_storage: 'granted'
      });
    </script>
    <!-- Google tag (gtag.js) — carga DIFERIDA (1ª interacción o navegador inactivo) para no
         penalizar LCP/FCP. El config se encola en dataLayer y GA lo procesa al cargar el script.
         Respeta el Consent Mode de arriba; el banner CookieConsent concede/deniega analytics. -->
    <script>
      gtag('js', new Date());
      gtag('config', 'G-80WWV05ZTM');
      (function () {
        var loaded = false;
        var events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        function loadGA() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { window.removeEventListener(e, loadGA, true); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-80WWV05ZTM';
          document.head.appendChild(s);
        }
        events.forEach(function (e) {
          window.addEventListener(e, loadGA, { passive: true, capture: true, once: true });
        });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGA, { timeout: 5000 });
        } else {
          window.addEventListener('load', function () { setTimeout(loadGA, 3000); });
        }
      })();
    </script>
    <script>
      (function() {
        if (window.location.pathname === '/') {
          var ua = navigator.userAgent.toLowerCase();
          if (ua.indexOf('googlebot') !== -1 || ua.indexOf('bingbot') !== -1 || ua.indexOf('crawler') !== -1 || ua.indexOf('spider') !== -1) return;
          
          var savedLang = localStorage.getItem('standarte_lang');
          if (savedLang === 'es') return;
          if (savedLang && savedLang !== 'es') {
            window.location.replace('/' + savedLang + '/');
            return;
          }
          if (!savedLang) {
            var browserLang = (navigator.language || navigator.userLanguage || '').substring(0, 2).toLowerCase();
            if (browserLang === 'es') return;
            var supportedLangs = ['en', 'de', 'zh', 'hi', 'pt', 'fr', 'it', 'ko', 'ja'];
            if (supportedLangs.includes(browserLang)) {
              window.location.replace('/' + browserLang + '/');
            } else {
              window.location.replace('/en/');
            }
          }
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Inconsolata:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Inconsolata:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Inconsolata:wght@400;700&display=swap" />
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
