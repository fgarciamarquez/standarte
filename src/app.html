<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        personalization_storage: 'denied',
        security_storage: 'granted'
      });
    </script>
    <!-- Google tag (gtag.js) — carga DIFERIDA (1ª interacción o navegador inactivo) para no
         penalizar LCP/FCP. El config se encola en dataLayer y GA lo procesa al cargar el script.
         Respeta el Consent Mode de arriba; el banner CookieConsent concede/deniega analytics. -->
    <script>
      gtag('js', new Date());
      gtag('config', 'G-80WWV05ZTM');
      (function () {
        var loaded = false;
        var events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        function loadGA() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { window.removeEventListener(e, loadGA, true); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-80WWV05ZTM';
          document.head.appendChild(s);
        }
        events.forEach(function (e) {
          window.addEventListener(e, loadGA, { passive: true, capture: true, once: true });
        });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGA, { timeout: 5000 });
        } else {
          window.addEventListener('load', function () { setTimeout(loadGA, 3000); });
        }
      })();
    </script>
    <!-- Microsoft Clarity — solo se inyecta cuando el usuario da consentimiento de "Medición"
         (mismo criterio que analytics_storage de Google Consent Mode arriba). CookieConsent.svelte
         llama a window.loadClarity() al aceptar/tener guardada esa preferencia. -->
    <script>
      (function () {
        window.clarity = window.clarity || function () {
          (window.clarity.q = window.clarity.q || []).push(arguments);
        };
        window.loadClarity = function () {
          if (window.__clarityLoaded) return;
          window.__clarityLoaded = true;
          var t = document.createElement('script');
          t.async = true;
          t.src = 'https://www.clarity.ms/tag/xjrr949owt?ref=bwt';
          var y = document.getElementsByTagName('script')[0];
          y.parentNode.insertBefore(t, y);
        };
      })();
    </script>
    <script>
      (function() {
        if (window.location.pathname === '/') {
          var ua = navigator.userAgent.toLowerCase();
          if (ua.indexOf('googlebot') !== -1 || ua.indexOf('bingbot') !== -1 || ua.indexOf('crawler') !== -1 || ua.indexOf('spider') !== -1) return;
          
          // Solo redirigimos si el usuario ELIGIÓ antes un idioma (preferencia guardada).
          // Antes, sin preferencia, se auto-detectaba el idioma del navegador y se
          // redirigía la home ES a /xx/. Eliminado por coherencia con el resto del sitio:
          // auto-redirigir por idioma es un antipatrón SEO (Google recomienda hreflang +
          // elección del usuario). La home ES permanece en '/' y el cambio es explícito.
          var savedLang = localStorage.getItem('standarte_lang');
          if (savedLang && savedLang !== 'es' && ['en','de','zh','hi','pt','fr','it','ko','ja'].includes(savedLang)) {
            window.location.replace('/' + savedLang + '/');
          }
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <!-- Fuentes autoalojadas, incrustadas y variables. Ver static/fonts/fonts.css -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/roboto-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inconsolata-latin.woff2" crossorigin />
    <style>@font-face{font-family:'Inconsolata';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/inconsolata-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}@font-face{font-family:'Inconsolata';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/inconsolata-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/roboto-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/roboto-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}</style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
