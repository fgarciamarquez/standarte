<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        personalization_storage: 'denied',
        security_storage: 'granted'
      });
    </script>
    <script>
      (function() {
        if (window.location.pathname === '/') {
          var ua = navigator.userAgent.toLowerCase();
          if (ua.indexOf('googlebot') !== -1 || ua.indexOf('bingbot') !== -1 || ua.indexOf('crawler') !== -1 || ua.indexOf('spider') !== -1) return;
          
          var savedLang = localStorage.getItem('standarte_lang');
          if (savedLang === 'es') return;
          if (savedLang && savedLang !== 'es') {
            window.location.replace('/' + savedLang + '/');
            return;
          }
          if (!savedLang) {
            var browserLang = (navigator.language || navigator.userLanguage || '').substring(0, 2).toLowerCase();
            if (browserLang === 'es') return;
            var supportedLangs = ['en', 'de', 'zh', 'hi', 'pt', 'fr', 'it', 'ko', 'ja'];
            if (supportedLangs.includes(browserLang)) {
              window.location.replace('/' + browserLang + '/');
            } else {
              window.location.replace('/en/');
            }
          }
        }
      })();
    </script>
    <script>
      // Fuente por idioma (ja/zh/ko/hi). Se marca el idioma activo en <html data-lang>
      // cuanto antes (para aplicar fuente-fallback y colores sin parpadeo) y la hoja de
      // la fuente se carga TRAS el pintado completo y SOLO para el idioma en uso, fuera
      // del critical path (máximo rendimiento). window.__applyLangFont permite además
      // reaplicarla en los cambios de idioma en cliente (p. ej. proyectos con ?lang=).
      (function () {
        var FAMILY = {
          ja: 'WDXL+Lubrifont+JP+N',
          zh: 'ZCOOL+QingKe+HuangYou',
          ko: 'Do+Hyeon',
          hi: 'Rozha+Uno'
        };
        function loadSheet(lang) {
          if (!FAMILY[lang] || document.querySelector('link[data-langfont="' + lang + '"]')) return;
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = 'https://fonts.googleapis.com/css2?family=' + FAMILY[lang] + '&display=swap';
          l.setAttribute('data-langfont', lang);
          document.head.appendChild(l);
        }
        window.__applyLangFont = function (lang) {
          var root = document.documentElement;
          if (!FAMILY[lang]) { root.removeAttribute('data-lang'); return; }
          root.setAttribute('data-lang', lang);
          if (document.readyState === 'complete') loadSheet(lang);
          else window.addEventListener('load', function () { loadSheet(lang); }, { once: true });
        };
        var m = location.pathname.match(/^\/(ja|zh|ko|hi)(\/|$)/);
        var lang = m ? m[1] : null;
        if (!lang) { try { lang = new URLSearchParams(location.search).get('lang'); } catch (e) {} }
        if (lang && FAMILY[lang]) window.__applyLangFont(lang);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Inconsolata:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Inconsolata:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400&family=Inconsolata:wght@400;700&display=swap" />
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
